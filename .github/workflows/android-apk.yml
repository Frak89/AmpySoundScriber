name: Build AmpySoundScriber APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"
      - name: Ensure Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Assemble installable debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AmpySoundScriber-0.1.0-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
